name: Pre-merge to master

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master

jobs:
  discover-workspaces:
    name: Discover Workspaces
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect workspace metadata
        id: collect
        run: |
          set -euo pipefail

          mapfile -t workspaces < <(find packages -mindepth 1 -maxdepth 1 -type d -print | sort)
          if [ "${#workspaces[@]}" -eq 0 ]; then
            echo 'matrix=[]' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          matrix_json=$(
            for workspace in "${workspaces[@]}"; do
              name=$(basename "${workspace}")
              jq -nc --arg name "${name}" '{name: $name}'
            done | jq -sc '.'
          )

          echo "Discovered matrix: ${matrix_json}"
          echo "matrix=${matrix_json}" >>"$GITHUB_OUTPUT"

  workspace-checks:
    name: Workspace Checks (${{ matrix.workspace.name }})
    needs: discover-workspaces
    if: needs.discover-workspaces.result == 'success' && needs.discover-workspaces.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJson(needs.discover-workspaces.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --group dev --all-packages --locked

      - name: Lint (${{ matrix.workspace.name }})
        run: uv run poe ws ${{ matrix.workspace.name }} lint

      - name: Typecheck (${{ matrix.workspace.name }})
        run: uv run poe ws ${{ matrix.workspace.name }} typecheck

      - name: Test (${{ matrix.workspace.name }})
        run: |
          set -euo pipefail
          {
            echo "### Coverage report (${{ matrix.workspace.name }})"
            echo
            uv run poe ws ${{ matrix.workspace.name }} coverage -- \
              -q \
              --cov-report=term:skip-covered \
              --color=no \
              --no-header
          } | tee -a "$GITHUB_STEP_SUMMARY"

  workspace-checks-summary:
    name: Workspace Checks Summary
    needs: workspace-checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Report workspace status
        run: |
          result='${{ needs.workspace-checks.result }}'
          level="notice"

          if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
            level="error"
          fi

          echo "::${level}::Workspace checks outcome: ${result}"
          if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
            exit 1
          fi
