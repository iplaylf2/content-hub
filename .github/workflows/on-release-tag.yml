name: On release tag

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

jobs:
  build:
    name: Build Distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stage package metadata
        run: |
          cp README.md packages/content-hub/README.md
          cp LICENSE packages/content-hub/LICENSE

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Extract release version
        id: parse-tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        run: uv build
        working-directory: packages/content-hub
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.parse-tag.outputs.version }}

      - name: Upload package distributions
        uses: actions/upload-artifact@v7
        with:
          name: content-hub-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Package
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          name: content-hub-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1
        with:
          packages-dir: dist
