name: On release tag

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare package metadata files
        run: |
          cp README.md packages/content-hub/README.md
          cp LICENSE packages/content-hub/LICENSE

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Parse tag
        id: parse-tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: uv build
        working-directory: packages/content-hub
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.parse-tag.outputs.version }}

      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.13.0
